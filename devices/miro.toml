# Adapted for miro (REDMI K80 Pro) by zhyukun, 2026.
# Upstream: kirklin/skyward, GPL-3.0-or-later; original copyright retained.
[device]
codename = "miro"
brand = "Redmi"
model = "REDMI K80 Pro"
ab = true
soc = { hans = "骁龙®8至尊版移动平台", hant = "Snapdragon® 8 Elite 行動平台", en = "Snapdragon® 8 Elite Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# The panel's own mode, persist.sys.miui_default_resolution in the odm
# partition's build.prop and the o11u panels' mode in the device tree:
# 1440 by 3200. persist.sys.miui_resolution gives the lower mode the system
# starts in, 1080 by 2400 at 450; the density is that one's, at the panel's
# own width, as the 13 Ultra's is.
width = 1440
height = 3200
density = 600

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: FocalTech's, over SPI behind Xiaomi's touch layer, the
# one touch driver the phone's own modules.load lists.
# The NXP secure element/NFC controller driver: without it no /dev/nq-nci
# node comes up, so the secure element service cannot enumerate the eSE and
# the NXP Weaver cannot read its slots. Its modules.dep dependencies
# (smcinvoke_dlkm, mem_object, si_core_module, qseecom_proxy) load first.
load = ["focaltech_touch", "nxp-nci"]

# The secure element's node, which the NXP driver makes. Stock
# /vendor/etc/ueventd.rc gives /dev/nq-nci to nfc:nfc 0660; a freshly loaded
# recovery module must get those permissions before the secure element HAL
# opens the node.
[[owners]]
user = "nfc"
group = "nfc"
mode = 0o660
paths = ["/dev/nq-nci"]

# As on the 17 Ultra, no init script of the phone's starts touch_report:
# the touch feature service turns the controller's raw frames into
# touches with /odm/lib64/libtouchreport.so, and a recovery runs none of
# it. Told through Xiaomi's touch layer, the driver has the controller
# report positions itself; that is known of the 17 Ultra's Synaptics
# controller and not yet tried on this phone's FocalTech one.
[touch]
writes = [{ path = "/sys/class/touch/touch_dev/enable_touch_raw", value = "0" }]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor, which holds them at
# their highest clock; the script hands them to WALT, lets idle CPUs power
# down and sets how the memory bus scales. Without it the CPUs stay at
# their highest clock and voltage even while idle, and the phone slowly
# heats up.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# BootControl: vendor's AIDL boot HAL, started here because its own init's
# early_hal class never runs in the recovery. Root:root as its rc says;
# IBootControl/default is declared by both the system and vendor vintf
# manifests. Verified on the A17 recovery: the binary stays on binder.
[[service]]
path = "/vendor/bin/hw/android.hardware.boot-service.qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.boot.IBootControl/default"
user = "root"
groups = ["root"]

# persist keeps the phone's saved settings, touch/camera/sensor calibrations
# and the secure world's own files; fstab.qcom mounts it at /mnt/vendor/persist.
[partitions]
mounted = ["persist"]

# WLAN: the peach node in the device tree. The chip enumerates revision 0x2,
# so the peach_v2 host driver drives it; the plain peach driver is built for
# revision 0x1 and cnss rejects it, and this loader stops at the first module
# that fails, so only peach_v2 is listed. Their cfg80211 asks for rfkill, one
# of the kernel's own modules in system_dlkm, as the 17 Ultra's does. The
# settings are handed to the loader from the vendor partition; on this build
# persist/wlan holds no wlan_mac.bin (the address comes from elsewhere), so
# none is placed for the loader. wpa_supplicant runs on the recovery's own
# libraries before the vendor partition's, as on the 17 Ultra.
[wlan]
modules = ["rfkill", "qca_cld3_peach_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/peach_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/peach_v2/WCNSS_qcom_cfg.ini" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"

# The stock build the recovery is made on: the Chinese system's
# OS3.0.305.0, whose full update package on the phone maker's own download
# server holds the recovery partition the recovery is built on top of.
[stock]
version = "OS3.0.305.0.WOMCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.305.0.WOMCNXM/miro-ota_full-OS3.0.305.0.WOMCNXM-user-16.0-bc8ed08af5.zip"
recovery = "8c0e2edb504f4a0e95d91ad7e5902aedf13bfb81ee514028a94ec089b504932b"

# qcom-hv-haptics (qcom,hv-haptics in its dtbo), whose driver says the
# motor's resonant frequency as the 17 Ultra's does; the click is made from
# samples at that frequency, and the strengths are the 17 Ultra's. Neither
# is yet tried on this phone's motor.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.25, strongest = 0.75 }
